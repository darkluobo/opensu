[project]
name = "opensu-sketchup"
version = "1.14.0"
description = "OpenSU — open-source AI modeling agent for SketchUp with bounded local automation, drawing reconstruction, semantic grouping, and semantic building workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "darkluobo / OpenSU contributors"}
]
keywords = ["opensu", "sketchup", "codex", "ai-agent", "mcp", "architecture", "cad", "3d"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3.0,<2"
]

[project.urls]
Homepage = "https://github.com/darkluobo/opensu"
Issues = "https://github.com/darkluobo/opensu/issues"

[project.scripts]
opensu = "sketchup_mcp.phase1_server:main"
sketchup-mcp = "sketchup_mcp.phase1_server:main"
neonexai-sketchup-mcp = "sketchup_mcp.phase1_server:main"

[project.entry-points.mcp]
opensu = "sketchup_mcp.phase1_server:mcp"
sketchup = "sketchup_mcp.phase1_server:mcp"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
