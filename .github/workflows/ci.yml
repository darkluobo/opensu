name: CI

on:
  push:
  pull_request:
    branches: [main, phase1-architecture-mvp, phase2-building-elements]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: python -m py_compile src/sketchup_mcp/*.py skills/sketchup-modeling/scripts/opensu.py
      - run: python skills/sketchup-modeling/scripts/opensu.py --help
      - run: python skills/sketchup-modeling/scripts/opensu.py create-curtain-wall --help
      - run: python -m pytest tests/ -v

  ruby-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["2.7", "3.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Check SketchUp extension Ruby syntax
        run: |
          ruby -c su_mcp.rb
          ruby -c su_mcp/su_mcp.rb
          ruby -c su_mcp/su_mcp/bootstrap.rb
          ruby -c su_mcp/su_mcp/main.rb
          ruby -c su_mcp/su_mcp/architecture.rb
          ruby -c su_mcp/su_mcp/architecture_completion.rb
          ruby -c su_mcp/su_mcp/architecture_validation.rb
          ruby -c su_mcp/su_mcp/building_elements.rb
          ruby -c su_mcp/su_mcp/building_elements_validation.rb
          ruby -c su_mcp/su_mcp/storefront.rb
          ruby -c su_mcp/su_mcp/storefront_validation.rb

  package-rbz:
    needs: [python-test, ruby-syntax]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build RBZ
        run: python scripts/build_rbz.py
      - name: Verify package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          rbz = Path('dist/opensu-sketchup-mcp-storefront.rbz')
          if not rbz.is_file():
              raise SystemExit('RBZ was not created')
          with ZipFile(rbz) as archive:
              names = set(archive.namelist())
          required = {
              'su_mcp.rb',
              'su_mcp/su_mcp/bootstrap.rb',
              'su_mcp/su_mcp/main.rb',
              'su_mcp/su_mcp/architecture.rb',
              'su_mcp/su_mcp/architecture_completion.rb',
              'su_mcp/su_mcp/architecture_validation.rb',
              'su_mcp/su_mcp/building_elements.rb',
              'su_mcp/su_mcp/building_elements_validation.rb',
              'su_mcp/su_mcp/storefront.rb',
              'su_mcp/su_mcp/storefront_validation.rb',
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'Missing RBZ files: {missing}')
          print(f'RBZ OK: {rbz} ({rbz.stat().st_size} bytes)')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: opensu-sketchup-mcp-storefront
          path: dist/opensu-sketchup-mcp-storefront.rbz
          if-no-files-found: error
